<svg xmlns="http://www.w3.org/2000/svg" width="560" height="216" viewBox="0 0 560 216" role="img" aria-label="Press What&#x27;s this? The phone speaks one to three plain sentences about what the camera sees. Hands off the shutter. A spoken countdown, then it takes the picture for you. It never refuses a shot. Dark or blurry, it says so and describes what it can."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a3a"/><stop offset="1" stop-color="#7f5a3f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="309.7" height="126" rx="10"/></clipPath><rect width="309.7" height="126" rx="10" fill="url(#n)"/><rect width="309.7" height="4" fill="#8a6a3a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="308.7" height="125" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="157" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ded5c7">🗣️ Press What&#x27;s this?</text><text x="157" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">The phone speaks one to three plain</text><text x="157" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">sentences about what the camera</text><text x="157" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">sees.</text></g><g transform="translate(319.7,0)"><clipPath id="c0_1"><rect width="240.3" height="126" rx="10"/></clipPath><rect width="240.3" height="126" rx="10" fill="url(#n)"/><rect width="240.3" height="4" fill="#8a6a3a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="239.3" height="125" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="122" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ded5c7">🔔 Hands off the</text><text x="122" text-anchor="middle" y="59" font-size="18" font-weight="700" fill="#ded5c7">shutter</text><text x="122" text-anchor="middle" y="88" font-size="16" font-weight="500" fill="#f2f5fa">A spoken countdown, then</text><text x="122" text-anchor="middle" y="111" font-size="16" font-weight="500" fill="#f2f5fa">it takes the picture for you.</text></g><g transform="translate(0.0,136)"><clipPath id="c1_0"><rect width="560.0" height="80" rx="10"/></clipPath><rect width="560.0" height="80" rx="10" fill="url(#n)"/><rect width="560.0" height="4" fill="#8a6a3a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="79" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="282" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ded5c7">✅ It never refuses a shot</text><text x="282" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Dark or blurry, it says so and describes what it can.</text></g></g></svg>
