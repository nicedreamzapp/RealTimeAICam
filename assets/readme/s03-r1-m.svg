<svg xmlns="http://www.w3.org/2000/svg" width="358" height="326" viewBox="0 0 358 326" role="img" aria-label="Press What&#x27;s this? The phone speaks one to three plain sentences about what the camera sees. Hands off the shutter. A spoken countdown, then it takes the picture for you. It never refuses a shot. Dark or blurry, it says so and describes what it can."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a3a"/><stop offset="1" stop-color="#7f5a3f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="102" rx="10"/></clipPath><rect width="358.0" height="102" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#8a6a3a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ded5c7">🗣️ Press What&#x27;s this?</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">The phone speaks one to three plain</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">sentences about what the camera sees.</text></g><g transform="translate(0.0,112)"><clipPath id="c1_0"><rect width="358.0" height="102" rx="10"/></clipPath><rect width="358.0" height="102" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#8a6a3a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ded5c7">🔔 Hands off the shutter</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">A spoken countdown, then it takes the</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">picture for you.</text></g><g transform="translate(0.0,224)"><clipPath id="c2_0"><rect width="358.0" height="102" rx="10"/></clipPath><rect width="358.0" height="102" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#8a6a3a" clip-path="url(#c2_0)"/><rect x=".5" y=".5" width="357.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ded5c7">✅ It never refuses a shot</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Dark or blurry, it says so and describes</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">what it can.</text></g></g></svg>
