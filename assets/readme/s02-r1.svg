rator 0.8B</text><text x="135" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">The on-device narrator, run</text><text x="135" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">through upstream MLX Swift.</text></g><g transform="translate(573.4,0)"><clipPath id="c0_2"><rect width="246.6" height="133" rx="10"/></clipPath><rect width="246.6" height="133" rx="10" fill="url(#n)"/><rect width="246.6" height="4" fill="#8a4f68" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="245.6" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="125" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decdd4">🤖 The Android port</text><text x="125" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Jetpack Compose UI and</text><text x="125" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">a TensorFlow Lite</text><text x="125" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">detector.</text></g></g></svg>
