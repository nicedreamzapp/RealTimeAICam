<svg xmlns="http://www.w3.org/2000/svg" width="820" height="133" viewBox="0 0 820 133" role="img" aria-label="Press What&#x27;s this? The phone speaks one to three plain sentences about what the camera sees. Hands off the shutter. A spoken countdown, then it takes the picture for you. It never refuses a shot. Dark or blurry, it says so and describes what it can."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a3a"/><stop offset="1" stop-color="#7f5a3f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="289.0" height="133" rx="10"/></clipPath><rect width="289.0" height="133" rx="10" fill="url(#n)"/><rect width="289.0" height="4" fill="#8a6a3a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="288.0" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="147" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#ded5c7">🗣️ Press What&#x27;s this?</text><text x="147" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">The phone speaks one to three</text><text x="147" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">plain sentences about what the</text><text x="147" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">camera sees.</text></g><g transform="translate(301.0,0)"><clipPath id="c0_1"><rect width="250.2" height="133" rx="10"/></clipPath><rect width="250.2" height="133" rx="10" fill="url(#n)"/><rect width="250.2" height="4" fill="#8a6a3a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="249.2" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="127" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#ded5c7">🔔 Hands off the</text><text x="127" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#ded5c7">shutter</text><text x="127" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">A spoken countdown, then</text><text x="127" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">it takes the picture for you.</text></g><g transform="translate(563.2,0)"><clipPath id="c0_2"><rect width="256.8" height="133" rx="10"/></clipPath><rect width="256.8" height="133" rx="10" fill="url(#n)"/><rect width="256.8" height="4" fill="#8a6a3a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="255.8" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="130" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#ded5c7">✅ It never refuses a</text><text x="130" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#ded5c7">shot</text><text x="130" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">Dark or blurry, it says so</text><text x="130" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">and describes what it can.</text></g></g></svg>
